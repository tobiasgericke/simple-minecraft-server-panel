<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%235fb35f'/><rect x='3' y='4' width='3' height='3' fill='%23111'/><rect x='10' y='4' width='3' height='3' fill='%23111'/><rect x='6' y='8' width='4' height='4' fill='%23111'/></svg>">
<style>
  :root {
    --bg: #111418; --panel: #1a1f25; --line: #2a313a; --text: #d8dde3; --muted: #8a95a3;
    --ok: #5fb35f; --warn: #e0a33a; --bad: #e05a4f; --accent: #4f8fe0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--line); }
  .pill.ok { background: #1f3a1f; color: var(--ok); } .pill.warn { background: #3a2f1a; color: var(--warn); }
  .pill.bad { background: #3a1f1d; color: var(--bad); }
  .spacer { flex: 1; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
           padding: 6px 14px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.go { border-color: #2f5a2f; } button.stop { border-color: #5a2f2c; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; padding: 12px 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .card .s { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  #log { flex: 1; margin: 0 16px; background: #0b0d10; border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 10px; overflow-y: auto; font: 12px/1.45 ui-monospace, Consolas, monospace;
         white-space: pre-wrap; overflow-wrap: anywhere; min-height: 200px; }
  #log .w { color: var(--warn); } #log .e { color: var(--bad); } #log .c { color: var(--accent); }
  #log .t { color: #56606c; }
  #log .pn { font-weight: 700; }                       /* player name, colour set inline */
  #log .chat { background: rgba(79,143,224,.08); border-left: 3px solid var(--accent);
               padding: 1px 6px; margin: 1px 0; border-radius: 0 4px 4px 0; }
  #log .chat .msg { color: #f0f3f6; }
  #log .join { color: #7fcf7f; } #log .leave { color: #e06c6c; }
  #log .adv { color: #e8c45a; } #log .death { color: #c792ea; } #log .pcmd { color: var(--muted); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
           padding: 3px 6px; font: inherit; }
  #archive-note { color: var(--warn); display: none; }
  #log.chat-only > div:not(.player) { display: none; }
  .logbar { display: flex; align-items: center; gap: 8px; padding: 0 16px 6px; color: var(--muted); font-size: 12px; }
  .logbar label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  form { display: flex; gap: 8px; padding: 10px 16px 14px; }
  input { flex: 1; background: #0b0d10; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
          padding: 8px 10px; font: 13px ui-monospace, Consolas, monospace; min-width: 0; }
  input:focus { outline: none; border-color: var(--accent); }
  #toast { position: fixed; right: 16px; bottom: 70px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 8px 12px; display: none; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<header>
  <h1 id="name">Minecraft</h1>
  <span id="state" class="pill">…</span>
  <span class="spacer"></span>
  <button class="go" id="b-start" onclick="power('start')">Start</button>
  <button id="b-restart" onclick="power('restart')">Restart</button>
  <button class="stop" id="b-stop" onclick="power('stop')">Stop</button>
</header>

<section class="cards">
  <div class="card"><div class="k">Players</div><div class="v" id="players">–</div><div class="s" id="names"></div></div>
  <div class="card" title="Total memory of the Java process. The heap holds the world (chunks, entities, players); Java itself needs roughly 0.3–0.6 GB on top (compiled code, threads, garbage collector). 'swapped' was moved to disk because RAM is full, which causes lag spikes.">
    <div class="k">Memory</div><div class="v" id="ram">–</div><div class="s" id="ram-s"></div></div>
  <div class="card"><div class="k">CPU</div><div class="v" id="cpu">–</div><div class="s" id="uptime"></div></div>
  <div class="card"><div class="k">Last backup</div><div class="v" id="backup">–</div><div class="s" id="backup-s"></div></div>
  <div class="card"><div class="k">Backup</div>
    <button id="b-dl" style="margin-top:6px" onclick="download()">Download now</button></div>
</section>

<div class="logbar">
  <select id="logsel" title="Older logs are archived by the server on every restart and each day">
    <option value="">Live log</option>
  </select>
  <span id="archive-note">archived log, not live</span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="chat-only"> Chat only</label>
</div>
<div id="log"></div>
<form id="console">
  <input id="cmd" placeholder="Console command, e.g. list, say Hello, op Name   (↑/↓ = history)" autocomplete="off">
  <button>Send</button>
</form>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const GB = 1024 ** 3;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t.timer); t.timer = setTimeout(() => t.style.display = 'none', 4000);
}
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function ago(s) {
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`;
  if (s < 86400 * 2) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} days ago`;
}
function dur(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return 'up ' + (d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`);
}
const gb = b => (b / GB).toFixed(1) + ' GB';

// --- status every 3 s ---
async function refresh() {
  let s;
  try { s = await (await fetch('/api/status')).json(); } catch { return; }
  $('name').textContent = document.title = s.name;
  const labels = { active: s.ready ? ['Online', 'ok'] : ['Starting …', 'warn'], activating: ['Starting …', 'warn'],
                   deactivating: ['Stopping …', 'warn'], inactive: ['Offline', 'bad'], failed: ['Crashed', 'bad'] };
  const [txt, cls] = labels[s.state] || [s.state, ''];
  $('state').textContent = txt; $('state').className = 'pill ' + cls;
  const up = s.state === 'active', busy = ['activating', 'deactivating'].includes(s.state);
  $('b-start').disabled = up || busy; $('b-stop').disabled = !up; $('b-restart').disabled = !up;
  $('b-dl').disabled = busy;

  $('players').textContent = s.players ? `${s.players.online} / ${s.players.max}` : '–';
  $('names').textContent = s.players?.names.join(', ') || (s.players ? 'nobody online' : '');

  const p = s.process || {};
  if (p.rss) {
    $('ram').textContent = gb(p.rss) + ' in RAM';
    const sw = p.swap || 0, ratio = s.heap ? sw / s.heap : 0;
    $('ram').className = 'v ' + (ratio > 0.25 ? 'bad' : ratio > 0.05 ? 'warn' : '');
    const other = Math.max(0, p.rss + sw - s.heap);
    $('ram-s').textContent = (sw > 0.05 * GB ? `${gb(sw)} swapped! · ` : '')
      + (s.heap ? `heap ${gb(s.heap)} + Java ${gb(other)}` : '');
  } else { $('ram').textContent = '–'; $('ram').className = 'v'; $('ram-s').textContent = ''; }
  $('cpu').textContent = p.cpu_pct != null ? p.cpu_pct + ' %' : '–';
  $('uptime').textContent = p.uptime_s ? dur(p.uptime_s) : '';

  const b = s.backup, bv = $('backup');
  if (b) {
    const h = b.age_s / 3600;
    bv.textContent = ago(b.age_s);
    bv.className = 'v ' + (h > s.backup_crit_h ? 'bad' : h > s.backup_warn_h ? 'warn' : 'ok');
    $('backup-s').textContent = `${(b.size / GB).toFixed(2)} GB · via ${b.source} · `
      + new Date(b.time).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
  } else { bv.textContent = 'none yet'; bv.className = 'v bad'; $('backup-s').textContent = ''; }
}
refresh(); setInterval(refresh, 3000);

async function power(action) {
  const ask = { stop: 'Really stop the server?', restart: 'Really restart the server?' }[action];
  if (ask && !confirm(ask)) return;
  ['b-start', 'b-stop', 'b-restart'].forEach(id => $(id).disabled = true);
  toast({ start: 'Starting …', stop: 'Stopping (saving the world) …', restart: 'Restarting …' }[action]);
  try { await api('/api/power/' + action); toast('Done.'); }
  catch (e) { toast('Error: ' + e.message); }
  refresh();
}

function download() {
  if (!confirm('Create and download a backup now? (several GB; autosave is paused meanwhile)')) return;
  location.href = '/api/backup/download';
  toast('Creating backup, the download starts in a moment …');
}

// --- live log ---
const log = $('log');

// Player names: every name gets a fixed colour derived from the name itself
const players = new Set();
let nameRe = null;
function learn(name) {
  if (!name || players.has(name) || !/^\w{1,16}$/.test(name)) return;
  players.add(name);
  const alt = [...players].sort((a, b) => b.length - a.length).join('|');   // longest first
  nameRe = new RegExp(`(?<![\\w])(${alt})(?![\\w])`, 'g');
}
function nameColor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360}, 70%, 68%)`;
}
// Appends text to el, wrapping known player names in coloured spans (never uses innerHTML)
function withNames(el, text) {
  if (!nameRe) { el.append(text); return el; }
  let last = 0;
  for (const m of text.matchAll(nameRe)) {
    el.append(text.slice(last, m.index));
    const s = document.createElement('span');
    s.className = 'pn'; s.style.color = nameColor(m[1]); s.textContent = m[1];
    el.append(s);
    last = m.index + m[1].length;
  }
  el.append(text.slice(last));
  return el;
}
function span(cls, text) {
  const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; return s;
}

const DEATH = /^(\w{1,16}) (was |drowned|died|fell |burned|blew up|hit the ground|went up in flames|went off with|tried to swim|starved|suffocated|withered|froze|experienced kinetic|discovered the floor|walked into|didn't want to live)/;

// Splits "[12:00:00] [Thread/LEVEL]: message" and decides how the line is shown
function classify(text) {
  const m = text.match(/^(\[[\d:]+\] )?(\[[^\]]*\/([A-Z]+)\]: )?(.*)$/);
  const time = m[1] || '', thread = m[2] || '', level = m[3] || '';
  const msg = m[4].replace(/^System chat: /, '');
  let r;
  if ((r = msg.match(/^(?:\[Not Secure\] )?<(\w{1,16})> (.*)$/))) return { time, kind: 'chat', name: r[1], body: r[2] };
  if ((r = msg.match(/^(?:\[Not Secure\] )?\[Server\] (.*)$/))) return { time, kind: 'chat', name: 'Server', body: r[1] };
  if ((r = msg.match(/^(\w{1,16}) joined the game/))) return { time, kind: 'join', name: r[1], body: msg };
  if ((r = msg.match(/^(\w{1,16}) left the game/))) return { time, kind: 'leave', name: r[1], body: msg };
  if ((r = msg.match(/^(\w{1,16}) has (made the advancement|completed the challenge|reached the goal)/)))
    return { time, kind: 'adv', name: r[1], body: msg };
  // technical join/disconnect details: same colours, but hidden in "Chat only" (the join/left lines cover it)
  if ((r = msg.match(/^(\w{1,16})\[\/[^\]]*\] logged in with/)))
    return { time, kind: 'other', name: r[1], thread, body: msg, cls: 'join' };
  if ((r = msg.match(/^(\w{1,16})(?: \(\/[^)]*\))? lost connection/)))
    return { time, kind: 'other', name: r[1], thread, body: msg, cls: 'leave' };
  if ((r = msg.match(/^(\w{1,16}) issued server command: /)) && r[1] !== 'CONSOLE')
    return { time, kind: 'pcmd', name: r[1], body: msg };
  if ((r = msg.match(DEATH)) && players.has(r[1]) && /Server thread/.test(thread))
    return { time, kind: 'death', name: r[1], body: msg };
  let cls = '';
  if (/^(ERROR|FATAL)$/.test(level) || /Exception/.test(msg)) cls = 'e';
  else if (level === 'WARN') cls = 'w';
  else if (/issued server command|CONSOLE/.test(msg)) cls = 'c';
  return { time, kind: 'other', thread, body: msg, cls };
}

function renderLine(text) {
  const l = classify(text);
  if (l.name && l.name !== 'Server') learn(l.name);
  const div = document.createElement('div');
  if (l.time) div.append(span('t', l.time));
  if (l.kind === 'chat') {
    div.className = 'chat player';
    const n = span('pn', l.name);
    n.style.color = l.name === 'Server' ? 'var(--accent)' : nameColor(l.name);
    div.append(n, span('t', ': '), withNames(span('msg', ''), l.body));
  } else if (l.kind === 'other') {
    if (l.thread) div.append(span('t', l.thread));
    div.append(withNames(span(l.cls, ''), l.body));
  } else {
    div.className = 'player';           // join, leave, adv, death, pcmd: shown in "Chat only" too
    const icon = { join: '→ ', leave: '← ', adv: '★ ', death: '☠ ', pcmd: '/ ' }[l.kind];
    div.append(withNames(span(l.kind, icon), l.body));
  }
  return div;
}
// Live: append one line, keep at most 2000, follow the bottom only if the user is there
function addLine(text) {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.append(renderLine(text));
  while (log.childElementCount > 2000) log.firstChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

$('chat-only').onchange = e => {
  log.classList.toggle('chat-only', e.target.checked);
  log.scrollTop = log.scrollHeight;
  try { localStorage.setItem('chatOnly', e.target.checked ? '1' : ''); } catch {}
};
try { if (localStorage.getItem('chatOnly')) { $('chat-only').checked = true; log.classList.add('chat-only'); } } catch {}
// --- log source: live (SSE) or an archived log ---
let es = null;
function showLive() {
  log.replaceChildren(); $('archive-note').style.display = 'none';
  es = new EventSource('/api/logs');
  es.onmessage = e => addLine(e.data);
  es.addEventListener('reset', () => {
    addLine('──────── new log (server restarted) ────────');
    loadArchiveList();                                  // the previous log is an archive now
  });
}
async function showArchive(name) {
  log.replaceChildren(); $('archive-note').style.display = 'inline';
  log.append(span('t', 'loading …'));
  try {
    const r = await fetch('/api/logs/archive/' + encodeURIComponent(name));
    if (!r.ok) throw new Error(r.statusText);
    const lines = (await r.text()).split('\n');
    if ($('logsel').value !== name) return;            // switched again meanwhile
    // build everything off-screen first: one layout pass instead of one per line
    const frag = document.createDocumentFragment();
    for (const line of lines) frag.append(renderLine(line));
    log.replaceChildren(frag);
    log.scrollTop = log.scrollHeight;
  } catch (e) { log.replaceChildren(span('e', 'Could not load log: ' + e.message)); }
}
$('logsel').onchange = e => {
  if (es) { es.close(); es = null; }
  e.target.value ? showArchive(e.target.value) : showLive();
};
async function loadArchiveList() {
  try {
    const files = await (await fetch('/api/logs/archive')).json();
    const sel = $('logsel'), current = sel.value;
    sel.replaceChildren(new Option('Live log', ''));
    for (const f of files) {
      const [, date, n] = f.name.match(/^(\d{4}-\d{2}-\d{2})-(\d+)/);
      const label = new Date(date + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      sel.append(new Option(`${label}${n > 1 ? ' (' + n + ')' : ''}`, f.name));
    }
    sel.value = current;
  } catch {}
}

// Learn all known player names first, so even the first lines of the backlog get coloured
fetch('/api/players').then(r => r.json()).then(d => d.names.forEach(learn)).catch(() => {})
  .finally(() => { showLive(); loadArchiveList(); });

// --- console with history ---
const hist = []; let hi = 0;
$('console').onsubmit = async e => {
  e.preventDefault();
  const cmd = $('cmd').value.trim(); if (!cmd) return;
  hist.push(cmd); hi = hist.length; $('cmd').value = '';
  try { await api('/api/console', { cmd }); } catch (err) { toast('Error: ' + err.message); }
};
$('cmd').onkeydown = e => {
  if (e.key === 'ArrowUp' && hi > 0) { $('cmd').value = hist[--hi]; e.preventDefault(); }
  if (e.key === 'ArrowDown') { hi = Math.min(hist.length, hi + 1); $('cmd').value = hist[hi] || ''; e.preventDefault(); }
};
</script>
</body>
</html>
